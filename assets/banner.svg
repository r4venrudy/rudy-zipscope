<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Rudy ZipScope</title><desc id="desc">Two headers. One archive. Know where they disagree.</desc><rect width="1200" height="320" rx="16" fill="#090f17"/><path d="M4 0v320" stroke="#55e0b6" stroke-width="8"/><g font-family="monospace" fill="#55e0b6"><text x="42" y="44" font-size="13" letter-spacing="3">RUDY SYSTEMS / ARCHIVE INVESTIGATION</text><text x="42" y="286" font-size="13">C++20 / ZIP64 / BOUNDED DEFLATE / NATIVE EVIDENCE</text><text x="940" y="286" font-size="12" fill="#9db0c5">DEVELOPER PREVIEW</text></g><g font-family="Arial,sans-serif"><text x="40" y="122" font-size="58" font-weight="700" fill="#edf6ff">Rudy ZipScope</text><text x="42" y="170" font-size="24" fill="#a9c0d8">Two headers. One archive.</text><text x="42" y="208" font-size="18" fill="#a9c0d8">Reconcile the bytes before trusting the contents.</text></g><path d="M42 248h1116" stroke="#293e52"/><g font-family="monospace" font-size="12" text-anchor="middle"><rect x="785" y="60" width="340" height="44" rx="7" fill="#101e2b" stroke="#293e52"/><text x="955" y="87" fill="#55e0b6">CENTRAL DIRECTORY / DECLARED VIEW</text><path d="M955 106v28" stroke="#55e0b6"/><rect x="785" y="136" width="340" height="44" rx="7" fill="#101e2b" stroke="#293e52"/><text x="955" y="163" fill="#55e0b6">LOCAL RECORDS / VERIFIED BYTES</text><text x="955" y="215" fill="#a9c0d8">CRC-32 + SHA-256 / NO EXTRACTION</text></g></svg>
